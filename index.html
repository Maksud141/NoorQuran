<!doctype html>
<html lang="bn" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#2f7d20">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="description" content="তাফহীমুল কুরআন — কুরআন মাজীদ, বাংলা অনুবাদ, শব্দে-শব্দে অর্থ, তাফসীর, অডিও, নামাজ ও কিবলা">
<title>তাফহীমুল কুরআন</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <div id="splash" class="splash"><div class="splashInner"><div class="splashLogo">۞</div><h1>তাফহীমুল কুরআন</h1><p>কুরআন মাজীদ ও আধুনিক তাফসীর</p><button onclick="dismissSplash()">শুরু করুন</button></div></div>
  <header class="header">
    <button class="iconBtn" aria-label="Menu" onclick="openDrawer()">☰</button>
    <div class="brand">তাফহীমুল কুরআন<small>কুরআন মাজীদ ও আধুনিক তাফসীর</small></div>
    <button class="iconBtn" aria-label="Search" onclick="navigate('search')">⌕</button>
  </header>
  <main id="screen"></main>
  <nav class="bottomNav">
    <button data-route="home" onclick="navigate('home')"><b>▰</b><span>হোম</span></button>
    <button data-route="library" onclick="navigate('library')"><b>▤</b><span>লাইব্রেরি</span></button>
    <button data-route="favorite" onclick="navigate('favorite')"><b>♥</b><span>ফেভারিট</span></button>
    <button data-route="prayer" onclick="navigate('prayer')"><b>♧</b><span>নামাজ</span></button>
    <button data-route="settings" onclick="navigate('settings')"><b>⚙</b><span>সেটিংস</span></button>
  </nav>
</div>
<div id="drawer" class="overlay" onclick="if(event.target.id==='drawer')closeDrawer()"><aside class="drawer">
  <div class="drawerHead"><div class="drawerLogo">۞</div><div><h2>তাফহীমুল কুরআন</h2><span>কুরআন মাজীদ ও আধুনিক তাফসীর</span></div></div>
  <div class="drawerMenu">
    <button onclick="go('home')">⌂ <span>হোম</span></button><button onclick="go('library')">▤ <span>কুরআন</span></button><button onclick="go('tafsir')">☷ <span>তাফসীর</span></button><button onclick="go('search')">⌕ <span>সার্চ</span></button><button onclick="go('favorite')">♥ <span>ফেভারিট</span></button><button onclick="go('prayer')">♧ <span>নামাজের সময়</span></button><button onclick="go('qibla')">◉ <span>কিবলা</span></button><button onclick="go('settings')">⚙ <span>সেটিংস</span></button><button onclick="go('offline')">⬇ <span>অফলাইন ডেটা</span></button>
  </div>
  <div class="drawerFoot">তাফহীমুল কুরআন · v2.0</div>
</aside></div>
<div id="modal" class="modal" onclick="if(event.target.id==='modal')closeModal()"><div id="modalBox" class="modalBox"></div></div>
<audio id="player" preload="none"></audio>
<script src="app.js"></script>
</body></html>
